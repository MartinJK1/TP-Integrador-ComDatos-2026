<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Integrador</title>
    <link rel="stylesheet" href="Estilo.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="Botones.js"></script>
    <script src="TablaDinámica.js"></script>    
    <script src="Frecuencia.js"></script>
    <script type="module" src="Main.js"></script> 
</head>
<body>
    <header>
        <h1>Codificación de datos<br>Huffman y Shannon-Fano</h1>
    </header>
    
    <textarea id="contenido" class="caja-texto" placeholder="Ingrese el texto a codificar..." style="resize: none;"></textarea>
    
    <button class="boton1" onclick="mostrarInput()">Cargar<br>archivo .txt</button>
    <div id="caja-input" class="caja" style="display: none;">
        <input type="file" id="archivo" accept=".txt">
        <button onclick="cargarArchivo()">Subir archivo</button>
        <button onclick="ocultarInput()">Cerrar</button>
    </div>
    
    <button class="boton2" id="btn-analizar">Analizar texto</button>
    
    <div class="container">
        <div class="dinamic-table-container">
            <table class="dinamic-table-header">
                <tr>
                    <th colspan="4" id="super-th">Tabla de frecuencia y códigos</th>
                </tr>
                <tr>
                    <th>Símbolo</th>
                    <th>Frecuencia</th>
                    <th>Huffman</th>
                    <th>Shannon-Fano</th>
                </tr>
            </table>
            <table class="dinamic-table" id="tabla-dinamica">
                <tbody id="table-body">
                    </tbody>         
            </table>
        </div>
        <div class="static-table-container">
            <table class="static-table">
                <thead>
                    <tr>
                        <th>Algoritmo Huffman</th>
                        <th>Algoritmo Shannon-Fano</th>
                    </tr>
                </thead>
                <tbody>                    
                    <tr>
                        <td id="Tasa-Huffman">Tasa: -</td>
                        <td id="Tasa-Shannon">Tasa: -</td>
                    </tr>
                    <tr>
                        <td id="Longitud-Huffman">Long: -</td>
                        <td id="Longitud-Shannon">Long: -</td>
                    </tr>
                    <tr>
                        <td id="Eficiencia-Huffman">Eficiencia: -</td>
                        <td id="Eficiencia-Shannon">Eficiencia: -</td>
                    </tr>
                </tbody>
            </table>                
        </div>
    </div>        

    <div class="caja" id="caja-decodificacion">
            <h3 style="margin: 0; color: #333;">Mensaje codificado (Huffman)</h3>
            <textarea id="texto-codificado-huffman" class="caja-texto" style="margin: 0; width: auto; background-color: #fff;" readonly></textarea>
            
            <h3 style="margin: 15px 0 5px 0; color: #333;">Mensaje codificado (Shannon-Fano)</h3>
            <textarea id="texto-codificado-shannon" class="caja-texto" style="margin: 0; width: auto; background-color: #fff;" readonly></textarea>
            
            <!-- Aclaramos en el botón que decodificamos usando la cadena de Huffman -->
            <button id="btn-decodificar" class="boton1" style="margin: 10px 0; width: fit-content;">Decodificar</button>
            
            <h3 style="margin: 0; color: #333;">Texto recuperado</h3>
            <textarea id="texto-recuperado" class="caja-texto" style="margin: 0; width: auto; background-color: #fff;" readonly></textarea>
        </div>
</body>
</html>
